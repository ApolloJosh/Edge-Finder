# Starts the main Edge Finder run every 15 minutes.
#
# GitHub's own schedule skips a lot of runs (Oct 24-25: 4 runs in 12 hours
# instead of 48), so this keeps the cadence. Each job loops for ~5.5 hours and
# then starts a fresh copy of itself; every main run also restarts it if it
# has stopped. It only starts runs - each run still decides what's due - so it
# costs no extra Odds API credits.

name: Ticker

on:
  workflow_dispatch:

permissions:
  actions: write

concurrency:
  group: ticker
  cancel-in-progress: true

jobs:
  tick:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Start a run every 15 minutes
        run: |
          end=$(( $(date +%s) + 330 * 60 ))
          while [ "$(date +%s)" -lt "$end" ]; do
            gh workflow run edge-finder.yml -R "$GITHUB_REPOSITORY" -f task=auto && echo "Started a run at $(date -u +%H:%MZ)"
            sleep 900
          done
          gh workflow run ticker.yml -R "$GITHUB_REPOSITORY"
